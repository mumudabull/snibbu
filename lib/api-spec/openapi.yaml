openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Completed upstream Snibbu game API. Practice only.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /contest:
    get:
      operationId: getContest
      responses:
        "200":
          description: Disabled contest with no invented details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Contest" }
  /leaderboard:
    get:
      operationId: getLeaderboard
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
        - in: query
          name: contest
          schema: { type: string, enum: ["0", "1"] }
      responses:
        "200":
          description: Persistent shared practice leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leaderboard" }
  /runs:
    post:
      operationId: issueRun
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunInput" }
      responses:
        "201":
          description: Issued practice run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
  /runs/{runId}/submit:
    post:
      operationId: submitRun
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayInput" }
      responses:
        "201":
          description: Replay verified and saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Contest:
      type: object
      required: [enabled, open, phase, timezone, startsAt, endsAt, rules, prizes, eligibility]
      properties:
        enabled: { type: boolean }
        open: { type: boolean }
        phase: { type: string }
        timezone: { type: ["string", "null"] }
        startsAt: { type: ["string", "null"] }
        endsAt: { type: ["string", "null"] }
        rules: { type: ["string", "null"] }
        prizes: { type: ["string", "null"] }
        eligibility: { type: ["string", "null"] }
    RunInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 200 }
    Run:
      type: object
      required: [runId, seed, name, levelCount, contestEligible, contest]
      properties:
        runId: { type: string }
        seed: { type: integer }
        name: { type: string }
        levelCount: { type: integer }
        contestEligible: { type: boolean }
        contest: { $ref: "#/components/schemas/Contest" }
    Frame:
      type: object
      additionalProperties: false
      required: [dt]
      properties:
        dt: { type: integer, minimum: 0, maximum: 1000 }
        hop: { type: ["string", "null"], enum: [up, down, left, right, null] }
    ReplayInput:
      type: object
      additionalProperties: false
      required: [frames]
      properties:
        frames:
          type: array
          minItems: 1
          maxItems: 120000
          items: { $ref: "#/components/schemas/Frame" }
        score: { type: integer }
        level: { type: integer }
    RunResult:
      type: object
      required: [runId, name, score, level, victory, reviewStatus, flags, prizeEligible, contestEntry, claimIdentityVerified]
      properties:
        runId: { type: string }
        name: { type: string }
        score: { type: integer }
        level: { type: integer }
        victory: { type: boolean }
        reviewStatus: { type: string }
        flags:
          type: array
          items: { type: string }
        prizeEligible: { type: boolean }
        contestEntry: { type: boolean }
        claimIdentityVerified: { type: boolean }
    Ranking:
      type: object
      required: [rank, name, score, level, victory, reviewStatus, prizeEligible, contestEntry, submittedAt, claimIdentityVerified]
      properties:
        rank: { type: integer }
        name: { type: string }
        score: { type: integer }
        level: { type: integer }
        victory: { type: boolean }
        reviewStatus: { type: string }
        prizeEligible: { type: boolean }
        contestEntry: { type: boolean }
        submittedAt: { type: string }
        claimIdentityVerified: { type: boolean }
    Leaderboard:
      type: object
      required: [title, ranking, contest, entries]
      properties:
        title: { type: string }
        ranking: { type: string }
        contest: { $ref: "#/components/schemas/Contest" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Ranking" }
